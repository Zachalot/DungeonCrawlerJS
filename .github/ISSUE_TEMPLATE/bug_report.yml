name: Bug report
description: Something in the game is broken or behaves differently than it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for playtesting! The more specific you are, the faster this gets fixed.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see, and what did you expect to see instead?
      placeholder: I swung the sword at a zombie right next to me, but it didn't take damage.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a new game
        2. Walk out of the north gate
        3. ...
    validations:
      required: true
  - type: input
    id: seed
    attributes:
      label: World seed
      description: Shown in the top-left panel, on the title screen, and in the pause menu (Esc).
      placeholder: "1695546368"
  - type: textarea
    id: save-code
    attributes:
      label: Save code (optional, but very helpful)
      description: Press Esc → Export save → Copy, then paste it here. It lets us load your exact game.
      render: text
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome 140 on Windows 11
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, console errors (F12 → Console), or how often it happens.
